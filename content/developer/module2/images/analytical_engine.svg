<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Babbage's Analytical Engine — schematisch</title>
<desc>Schematische weergave van de Analytical Engine: invoer via ponskaarten, verwerking in de mill, opslag in de store, en uitvoer via een printer. Dit is de eerste computer op papier.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th { font: 600 14px sans-serif; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
.tc { font: 400 11px sans-serif; fill: var(--s); font-style: italic; }
.c-gray rect  { fill: #f1efe8; stroke: #5f5e5a; }
.c-gray .th   { fill: #2c2c2a; } .c-gray .ts { fill: #5f5e5a; }
.c-blue rect  { fill: #e6f1fb; stroke: #185fa5; }
.c-blue .th   { fill: #042c53; } .c-blue .ts { fill: #185fa5; }
.c-teal rect  { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .th   { fill: #085041; } .c-teal .ts { fill: #0f6e56; }
.c-amber rect { fill: #faeeda; stroke: #854f0b; }
.c-amber .th  { fill: #412402; } .c-amber .ts { fill: #854f0b; }
.c-purple rect { fill: #eeedfe; stroke: #534ab7; }
.c-purple .th  { fill: #26215c; } .c-purple .ts { fill: #534ab7; }
@media (prefers-color-scheme: dark) {
  .c-gray rect   { fill: #2c2c2a; stroke: #b4b2a9; }
  .c-gray .th    { fill: #d3d1c7; } .c-gray .ts { fill: #b4b2a9; }
  .c-blue rect   { fill: #042c53; stroke: #85b7eb; }
  .c-blue .th    { fill: #b5d4f4; } .c-blue .ts { fill: #85b7eb; }
  .c-teal rect   { fill: #085041; stroke: #5dcaa5; }
  .c-teal .th    { fill: #9fe1cb; } .c-teal .ts { fill: #5dcaa5; }
  .c-amber rect  { fill: #412402; stroke: #ef9f27; }
  .c-amber .th   { fill: #fac775; } .c-amber .ts { fill: #ef9f27; }
  .c-purple rect { fill: #26215c; stroke: #afa9ec; }
  .c-purple .th  { fill: #cecbf6; } .c-purple .ts { fill: #afa9ec; }
}
line.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
</style>
</defs>

<!-- Titel -->
<text class="th" x="340" y="24" text-anchor="middle">Babbage's Analytical Engine (1837) — de eerste computer op papier</text>

<!-- Invoer -->
<g class="c-gray">
  <rect x="30" y="80" width="120" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="90" y="112" text-anchor="middle" dominant-baseline="central">Invoer</text>
  <text class="ts" x="90" y="136" text-anchor="middle" dominant-baseline="central">ponskaarten</text>
</g>
<text class="tc" x="90" y="178" text-anchor="middle">instructies &amp; data</text>

<!-- pijl invoer → mill -->
<line x1="150" y1="120" x2="198" y2="120" class="arr" marker-end="url(#arrow)"/>

<!-- Mill (processor) -->
<g class="c-blue">
  <rect x="200" y="60" width="140" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="270" y="108" text-anchor="middle" dominant-baseline="central">Mill</text>
  <text class="ts" x="270" y="130" text-anchor="middle" dominant-baseline="central">rekeneenheid</text>
  <text class="ts" x="270" y="150" text-anchor="middle" dominant-baseline="central">(processor)</text>
</g>
<text class="tc" x="270" y="198" text-anchor="middle">voert berekeningen uit</text>

<!-- pijl mill ↔ store -->
<line x1="340" y1="100" x2="388" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="388" y1="140" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>

<!-- Store (geheugen) -->
<g class="c-teal">
  <rect x="390" y="60" width="140" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="460" y="108" text-anchor="middle" dominant-baseline="central">Store</text>
  <text class="ts" x="460" y="130" text-anchor="middle" dominant-baseline="central">opslageenheid</text>
  <text class="ts" x="460" y="150" text-anchor="middle" dominant-baseline="central">(geheugen)</text>
</g>
<text class="tc" x="460" y="198" text-anchor="middle">bewaart tussenresultaten</text>

<!-- pijl mill → uitvoer -->
<line x1="530" y1="120" x2="578" y2="120" class="arr" marker-end="url(#arrow)"/>

<!-- Uitvoer -->
<g class="c-amber">
  <rect x="580" y="80" width="70" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="615" y="112" text-anchor="middle" dominant-baseline="central">Uitvoer</text>
  <text class="ts" x="615" y="136" text-anchor="middle" dominant-baseline="central">printer</text>
</g>
<text class="tc" x="615" y="178" text-anchor="middle">resultaat</text>

<!-- Modern equivalent onderaan -->
<line x1="40" y1="220" x2="640" y2="220" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="tc" x="340" y="238" text-anchor="middle">Modern equivalent:</text>

<g class="c-gray"><rect x="30"  y="248" width="100" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="80"  y="260" text-anchor="middle" dominant-baseline="central">toetsenbord</text></g>
<g class="c-blue"><rect x="200" y="248" width="140" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="270" y="260" text-anchor="middle" dominant-baseline="central">CPU / processor</text></g>
<g class="c-teal"><rect x="390" y="248" width="140" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="460" y="260" text-anchor="middle" dominant-baseline="central">RAM / harde schijf</text></g>
<g class="c-amber"><rect x="580" y="248" width="70" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="615" y="260" text-anchor="middle" dominant-baseline="central">scherm</text></g>

</svg>
