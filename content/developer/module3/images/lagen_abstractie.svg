<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lagen van abstractie in programmeertalen</title>
<desc>Een stapeldiagram van onderaf: transistors, machinetaal, assembly, C, Python. Elke laag verbergt de complexiteit van de laag eronder. Bovenaan staat de programmeur.</desc>
<defs>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th  { font: 600 14px sans-serif; fill: var(--t); }
.ts  { font: 400 12px sans-serif; fill: var(--s); }
.tc  { font: 400 11px sans-serif; fill: var(--s); font-style: italic; }
.tcode { font: 400 11px monospace; fill: var(--s); }
</style>
</defs>

<!-- Titel -->
<text class="th" x="340" y="22" text-anchor="middle">Lagen van abstractie — van bits naar Python</text>

<!-- Laag 5: Python (bovenste, meest abstract) -->
<rect x="100" y="40"  width="480" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text font-size="14" font-weight="600" x="220" y="59" fill="#085041" dominant-baseline="central">Python (1991)</text>
<text class="tcode" x="220" y="75" fill="#0f6e56" dominant-baseline="central">som = a + b</text>
<text class="tc" x="552" y="62" text-anchor="middle" fill="#0f6e56" dominant-baseline="central">leest als Engels</text>

<!-- Laag 4: C -->
<rect x="80"  y="92"  width="520" height="44" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text font-size="14" font-weight="600" x="200" y="111" fill="#042c53" dominant-baseline="central">C (1972)</text>
<text class="tcode" x="200" y="127" fill="#185fa5" dominant-baseline="central">int som = a + b;</text>
<text class="tc" x="562" y="114" text-anchor="middle" fill="#185fa5" dominant-baseline="central">compact, krachtig</text>

<!-- Laag 3: Assembly -->
<rect x="60"  y="144" width="560" height="44" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text font-size="14" font-weight="600" x="180" y="163" fill="#26215c" dominant-baseline="central">Assembly (1950s)</text>
<text class="tcode" x="180" y="179" fill="#534ab7" dominant-baseline="central">MOV AL, a  /  ADD AL, b  /  MOV som, AL</text>
<text class="tc" x="572" y="166" text-anchor="middle" fill="#534ab7" dominant-baseline="central">namen voor instructies</text>

<!-- Laag 2: Machinetaal -->
<rect x="40"  y="196" width="600" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text font-size="14" font-weight="600" x="160" y="215" fill="#412402" dominant-baseline="central">Machinetaal</text>
<text class="tcode" x="160" y="231" fill="#854f0b" dominant-baseline="central">10110000 01100001  00000101 00000001</text>
<text class="tc" x="582" y="218" text-anchor="middle" fill="#854f0b" dominant-baseline="central">nullen en enen</text>

<!-- Laag 1: Transistors (onderste) -->
<rect x="20"  y="248" width="640" height="44" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text font-size="14" font-weight="600" x="140" y="267" fill="#4a1b0c" dominant-baseline="central">Transistors &amp; elektronica</text>
<text class="tcode" x="140" y="283" fill="#993c1d" dominant-baseline="central">stroom aan / stroom uit  →  1 / 0</text>
<text class="tc" x="592" y="270" text-anchor="middle" fill="#993c1d" dominant-baseline="central">fysieke werkelijkheid</text>

<!-- Pijl omhoog links -->
<line x1="50" y1="290" x2="50" y2="48" stroke="var(--b)" stroke-width="1" marker-end="url(#arrow)"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text class="tc" x="36" y="170" text-anchor="middle" transform="rotate(-90 36 170)">meer abstractie →</text>

<!-- Onderschrift -->
<text class="ts" x="340" y="318" text-anchor="middle">Elke laag verbergt de complexiteit van de laag eronder.</text>
<text class="ts" x="340" y="334" text-anchor="middle">Jij schrijft Python — de computer ziet alleen nullen en enen.</text>

</svg>
