      ontbreken — trainee moet zelf doorvragen bij de klant.
    leerpunt: >
      Dit ticket oefent specifiek het doorvragen bij onvolledige opdrachten,
      een kernvaardigheid voor een servicedeskmedewerker.
    werkprocessen:
      - code: B1-K2-W1
        gedragingen:
          - achterhaalt snel de kern van het probleem, vat het geheel correct samen en controleert of de juiste informatie ingewonnen is
          - registreert relevante werkgegevens nauwkeurig en volledig in het daarvoor bestemde systeem
        vaardigheden:
          - kan verschillende communicatievaardigheden inzetten zoals luisteren en doorvragen
          - kan een gangbaar registratiesysteem gebruiken
      - code: B1-K2-W2
        gedragingen:
          - overlegt en stemt tijdig, binnen de gestelde kaders en op begrijpelijke wijze af met derden
          - denkt proactief mee aan een vlotte en werkbare oplossing
          - is in diens communicatie klantvriendelijk, correct en volledig
        vaardigheden:
          - kan feedback geven en ontvangen

