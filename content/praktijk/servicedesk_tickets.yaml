# =============================================================================
# servicedesk_tickets.yaml — Koppeling tickets aan competenties
# =============================================================================
#
# Dit bestand vormt de brug tussen de praktijk (TOPdesk tickets) en de
# formele competentiebeoordeling (kwalificatiedossier Medewerker ICT, Crebonr. 25999).
#
# HOE HET WERKT:
#   Als een docent een ticket markeert als "voldaan" in TestGarden,
#   worden de bijbehorende gedragingen en vaardigheden automatisch
#   geregistreerd als "aangetoond" voor die trainee.
#
#   De docent hoeft dan bij de formele praktijkbeoordeling niet meer te
#   reconstrueren wat de trainee allemaal gedaan heeft — dat overzicht
#   is er al. De docent beoordeelt alleen nog of de kwaliteit voldoende was.
#
# DRIE SOORTEN EVIDENCE:
#   1. gedragingen  → zichtbaar gedrag tijdens uitvoering (docent observeert)
#   2. vaardigheden → technische handelingen die aangetoond zijn
#   3. kennis       → wordt gedekt door theorievragen in TestGarden modules
#
# WERKPROCESSEN (uit kwalificatiedossier):
#   B1-K1-W1  Maakt devices gebruiksklaar
#   B1-K1-W2  Installeert, configureert en onderhoudt software
#   B1-K1-W3  Monteert en/of configureert netwerk- en infrastructuuronderdelen
#   B1-K2-W1  Neemt ICT-meldingen aan en handelt deze af
#   B1-K2-W2  Overlegt en stemt af met derden
#
# LET OP:
#   Dit is een concept — de koppeling per ticket is een voorstel op basis
#   van de ticketinhoud en het kwalificatiedossier. Docenten
#   controleren of de gedragingen en vaardigheden per ticket kloppen.
# =============================================================================

niveau: basis
track: servicedesk

tickets:

  - ticket_id: servicedesk.basis.t01
    titel: Nieuwe gebruiker aanmaken (Entra) — volledig opgegeven
    topdesk_onderwerp: MS365 Entra
    omschrijving: >
      Gebruikersaccount aanmaken voor Thomas de Vries, licentie Basic toekennen,
      logingegevens terugkoppelen aan HR.
    werkprocessen:
      - code: B1-K1-W2
        gedragingen:
          - werkt precies, bedreven en accuraat bij het installeren en onderhouden van software
          - houdt zich aan voorgeschreven procedures en geldende normen
        vaardigheden:
          - kan (software) updates uitvoeren
          - kan regels, afspraken en procedures toepassen die betrekking hebben op veiligheid en privacy
      - code: B1-K2-W1
        gedragingen:
          - registreert relevante werkgegevens nauwkeurig en volledig in het daarvoor bestemde systeem
          - koppelt de oplossing op begrijpelijke wijze aan de gebruiker terug
          - meldt tijdig en uit eigen beweging wanneer het werk afgerond is
        vaardigheden:
          - kan een gangbaar registratiesysteem gebruiken
          - kan rapporteren met de gangbare communicatiemiddelen
      - code: B1-K2-W2
        gedragingen:
          - is in diens communicatie klantvriendelijk, correct en volledig
        vaardigheden:
          - kan correcte omgangsvormen hanteren in contact met collega's en derden

  - ticket_id: servicedesk.basis.t02
