<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Git werkstroom: working directory, staging area en repository</title>
<desc>Drie zones: working directory, staging area en repository. git add stuurt naar staging, git commit naar repository.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th { font: 500 14px sans-serif; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
.c-gray rect  { fill: #f1efe8; stroke: #5f5e5a; }
.c-gray .th   { fill: #2c2c2a; }
.c-blue rect  { fill: #e6f1fb; stroke: #185fa5; }
.c-blue .th   { fill: #042c53; } .c-blue .ts { fill: #185fa5; }
.c-teal rect  { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .th   { fill: #085041; } .c-teal .ts { fill: #0f6e56; }
.pill-blue rect { fill: #e6f1fb; stroke: #185fa5; }
.pill-blue .ts  { fill: #042c53; }
.pill-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
.pill-teal .ts  { fill: #085041; }
@media (prefers-color-scheme: dark) {
  .c-gray rect  { fill: #2c2c2a; stroke: #b4b2a9; }
  .c-gray .th   { fill: #d3d1c7; }
  .c-blue rect  { fill: #042c53; stroke: #85b7eb; }
  .c-blue .th   { fill: #b5d4f4; } .c-blue .ts { fill: #85b7eb; }
  .c-teal rect  { fill: #085041; stroke: #5dcaa5; }
  .c-teal .th   { fill: #9fe1cb; } .c-teal .ts { fill: #5dcaa5; }
  .pill-blue rect { fill: #042c53; stroke: #85b7eb; }
  .pill-blue .ts  { fill: #b5d4f4; }
  .pill-teal rect { fill: #085041; stroke: #5dcaa5; }
  .pill-teal .ts  { fill: #9fe1cb; }
}
line.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
path.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
</style>
</defs>

<g class="c-gray">
  <rect x="40" y="40" width="160" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="120" y="76"  text-anchor="middle" dominant-baseline="central">Working directory</text>
  <text class="ts" x="120" y="98"  text-anchor="middle">jouw bestanden</text>
  <text class="ts" x="120" y="116" text-anchor="middle">zoals ze nu zijn</text>
</g>

<line x1="200" y1="90" x2="258" y2="90" class="arr" marker-end="url(#arrow)"/>
<g class="pill-blue"><rect x="202" y="68" width="56" height="20" rx="4" stroke-width="0.5"/><text class="ts" x="230" y="79" text-anchor="middle" dominant-baseline="central">git add</text></g>

<g class="c-blue">
  <rect x="260" y="40" width="160" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="340" y="76"  text-anchor="middle" dominant-baseline="central">Staging area</text>
  <text class="ts" x="340" y="98"  text-anchor="middle">klaargemaakt</text>
  <text class="ts" x="340" y="116" text-anchor="middle">voor commit</text>
</g>

<line x1="420" y1="90" x2="478" y2="90" class="arr" marker-end="url(#arrow)"/>
<g class="pill-teal"><rect x="416" y="68" width="68" height="20" rx="4" stroke-width="0.5"/><text class="ts" x="450" y="79" text-anchor="middle" dominant-baseline="central">git commit</text></g>

<g class="c-teal">
  <rect x="480" y="40" width="160" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="560" y="76"  text-anchor="middle" dominant-baseline="central">Repository</text>
  <text class="ts" x="560" y="98"  text-anchor="middle">momentopname</text>
  <text class="ts" x="560" y="116" text-anchor="middle">opgeslagen</text>
</g>

<path d="M260 148 Q200 168 120 148" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<text class="ts" x="192" y="174" text-anchor="middle">git diff</text>

<text class="ts" x="340" y="192" text-anchor="middle">git status laat zien in welke zone je bestanden zich bevinden</text>
</svg>
