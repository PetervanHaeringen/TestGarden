<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gecentraliseerd vs gedistribueerd versiebeheer</title>
<desc>Links: gecentraliseerd systeem met één centrale server. Rechts: gedistribueerd systeem waar iedereen de volledige history heeft.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --bg: #f1efe8; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --bg: #2c2c2a; --b: #5f5e5a; } }
.th { font: 500 14px sans-serif; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
/* teal */
.c-teal rect, .c-teal circle { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .th { fill: #085041; } .c-teal .ts { fill: #0f6e56; }
@media (prefers-color-scheme: dark) {
  .c-teal rect, .c-teal circle { fill: #085041; stroke: #5dcaa5; }
  .c-teal .th { fill: #9fe1cb; } .c-teal .ts { fill: #5dcaa5; }
}
/* coral */
.c-coral rect { fill: #faece7; stroke: #993c1d; }
.c-coral .th { fill: #4a1b0c; } .c-coral .ts { fill: #993c1d; }
@media (prefers-color-scheme: dark) {
  .c-coral rect { fill: #4a1b0c; stroke: #f0997b; }
  .c-coral .th { fill: #f5c4b3; } .c-coral .ts { fill: #f0997b; }
}
/* gray */
.c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
.c-gray .th { fill: #2c2c2a; } .c-gray .ts { fill: #5f5e5a; }
@media (prefers-color-scheme: dark) {
  .c-gray rect { fill: #2c2c2a; stroke: #b4b2a9; }
  .c-gray .th { fill: #d3d1c7; } .c-gray .ts { fill: #b4b2a9; }
}
line.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
line.div { stroke: var(--b); stroke-width: 0.5; }
</style>
</defs>

<text class="th" x="160" y="28" text-anchor="middle">Gecentraliseerd (SVN)</text>
<g class="c-coral">
  <rect x="100" y="44" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="160" y="62" text-anchor="middle" dominant-baseline="central">Server</text>
  <text class="ts" x="160" y="78" text-anchor="middle" dominant-baseline="central">volledige history</text>
</g>
<g class="c-gray">
  <rect x="40"  y="150" width="80" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="80" y="168" text-anchor="middle" dominant-baseline="central">Gebruiker A</text>
</g>
<g class="c-gray">
  <rect x="140" y="150" width="80" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="180" y="168" text-anchor="middle" dominant-baseline="central">Gebruiker B</text>
</g>
<g class="c-gray">
  <rect x="240" y="150" width="80" height="36" rx="6" stroke-width="0.5"/>
  <text class="ts" x="280" y="168" text-anchor="middle" dominant-baseline="central">Gebruiker C</text>
</g>
<line x1="80"  y1="150" x2="140" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="150" x2="180" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="150" x2="200" y2="88" class="arr" marker-end="url(#arrow)"/>
<rect x="60" y="210" width="200" height="28" rx="6" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="160" y="229" text-anchor="middle">Server uitgevallen → iedereen stil</text>

<line x1="340" y1="20" x2="340" y2="260" class="div" stroke-dasharray="6 4"/>

<text class="th" x="510" y="28" text-anchor="middle">Gedistribueerd (Git)</text>
<g class="c-teal">
  <rect x="440" y="44"  width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="505" y="62" text-anchor="middle" dominant-baseline="central">Gebruiker A</text>
  <text class="ts" x="505" y="78" text-anchor="middle" dominant-baseline="central">volledige history</text>
</g>
<g class="c-teal">
  <rect x="360" y="150" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="425" y="168" text-anchor="middle" dominant-baseline="central">Gebruiker B</text>
  <text class="ts" x="425" y="184" text-anchor="middle" dominant-baseline="central">volledige history</text>
</g>
<g class="c-teal">
  <rect x="510" y="150" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="575" y="168" text-anchor="middle" dominant-baseline="central">Gebruiker C</text>
  <text class="ts" x="575" y="184" text-anchor="middle" dominant-baseline="central">volledige history</text>
</g>
<line x1="490" y1="88"  x2="455" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="88"  x2="555" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="172" x2="508" y2="172" class="arr" marker-end="url(#arrow)"/>
<rect x="360" y="218" width="280" height="28" rx="6" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="500" y="237" text-anchor="middle">Server uitgevallen → iedereen werkt door</text>
</svg>
