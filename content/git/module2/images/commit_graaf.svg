<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Commit-graaf met main-branch, feature-branch en HEAD</title>
<desc>Commits A t/m E op main. Feature-branch begint bij C met commits F en G. HEAD wijst naar E op main.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th { font: 500 14px sans-serif; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
.c-teal circle   { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .th      { fill: #085041; }
.c-purple circle { fill: #eeedfe; stroke: #534ab7; }
.c-purple .th    { fill: #26215c; }
.c-amber rect    { fill: #faeeda; stroke: #854f0b; }
.c-amber .th     { fill: #412402; }
.c-teal-pill rect { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal-pill .ts  { fill: #085041; }
.c-purple-pill rect { fill: #eeedfe; stroke: #534ab7; }
.c-purple-pill .ts  { fill: #26215c; }
@media (prefers-color-scheme: dark) {
  .c-teal circle   { fill: #085041; stroke: #5dcaa5; }
  .c-teal .th      { fill: #9fe1cb; }
  .c-purple circle { fill: #26215c; stroke: #afa9ec; }
  .c-purple .th    { fill: #cecbf6; }
  .c-amber rect    { fill: #412402; stroke: #ef9f27; }
  .c-amber .th     { fill: #fac775; }
  .c-teal-pill rect { fill: #085041; stroke: #5dcaa5; }
  .c-teal-pill .ts  { fill: #9fe1cb; }
  .c-purple-pill rect { fill: #26215c; stroke: #afa9ec; }
  .c-purple-pill .ts  { fill: #cecbf6; }
}
line.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
path.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
</style>
</defs>

<text class="ts" x="40" y="72">main</text>
<g class="c-teal"><circle cx="90"  cy="110" r="22" stroke-width="0.5"/><text class="th" x="90"  y="114" text-anchor="middle" dominant-baseline="central">A</text></g>
<g class="c-teal"><circle cx="190" cy="110" r="22" stroke-width="0.5"/><text class="th" x="190" y="114" text-anchor="middle" dominant-baseline="central">B</text></g>
<g class="c-teal"><circle cx="290" cy="110" r="22" stroke-width="0.5"/><text class="th" x="290" y="114" text-anchor="middle" dominant-baseline="central">C</text></g>
<g class="c-teal"><circle cx="390" cy="110" r="22" stroke-width="0.5"/><text class="th" x="390" y="114" text-anchor="middle" dominant-baseline="central">D</text></g>
<g class="c-teal"><circle cx="490" cy="110" r="22" stroke-width="0.5"/><text class="th" x="490" y="114" text-anchor="middle" dominant-baseline="central">E</text></g>

<line x1="468" y1="110" x2="412" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="368" y1="110" x2="312" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="268" y1="110" x2="212" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="168" y1="110" x2="112" y2="110" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="192">feature</text>
<g class="c-purple"><circle cx="390" cy="200" r="22" stroke-width="0.5"/><text class="th" x="390" y="204" text-anchor="middle" dominant-baseline="central">F</text></g>
<g class="c-purple"><circle cx="490" cy="200" r="22" stroke-width="0.5"/><text class="th" x="490" y="204" text-anchor="middle" dominant-baseline="central">G</text></g>

<path d="M390 178 Q350 155 312 120" class="arr" marker-end="url(#arrow)"/>
<line x1="468" y1="200" x2="412" y2="200" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="454" y="50" width="72" height="24" rx="5" stroke-width="0.5"/>
  <text class="th" x="490" y="62" text-anchor="middle" dominant-baseline="central">HEAD</text>
</g>
<line x1="490" y1="74" x2="490" y2="88" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal-pill"><rect x="526" y="98" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="556" y="110" text-anchor="middle" dominant-baseline="central">main</text></g>
<g class="c-purple-pill"><rect x="526" y="188" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="556" y="200" text-anchor="middle" dominant-baseline="central">feature</text></g>

<text class="ts" x="40" y="248">Elke commit wijst naar zijn ouder (parent). HEAD toont waar jij nu bent.</text>
</svg>
