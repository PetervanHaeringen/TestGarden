<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Snapshots vs diffs — hoe Git bestanden bewaart</title>
<desc>Links: diff-systeem bewaart alleen wijzigingen. Rechts: Git bewaart volledige snapshots met verwijzingen voor ongewijzigde bestanden.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th { font: 500 14px sans-serif; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
.c-gray rect  { fill: #f1efe8; stroke: #5f5e5a; }
.c-gray .ts   { fill: #2c2c2a; }
.c-teal rect  { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .ts   { fill: #085041; }
.c-coral rect { fill: #faece7; stroke: #993c1d; }
.c-coral .ts  { fill: #4a1b0c; }
@media (prefers-color-scheme: dark) {
  .c-gray rect  { fill: #2c2c2a; stroke: #b4b2a9; }
  .c-gray .ts   { fill: #d3d1c7; }
  .c-teal rect  { fill: #085041; stroke: #5dcaa5; }
  .c-teal .ts   { fill: #9fe1cb; }
  .c-coral rect { fill: #4a1b0c; stroke: #f0997b; }
  .c-coral .ts  { fill: #f5c4b3; }
}
</style>
</defs>

<text class="th" x="150" y="26" text-anchor="middle">Diff-systeem</text>
<text class="ts" x="150" y="42" text-anchor="middle">bewaart alleen wijzigingen</text>

<g class="c-gray"><rect x="40" y="58" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="70" y="70" text-anchor="middle" dominant-baseline="central">v1</text></g>
<g class="c-gray"><rect x="40" y="98" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="70" y="110" text-anchor="middle" dominant-baseline="central">v2</text></g>
<g class="c-gray"><rect x="40" y="138" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="70" y="150" text-anchor="middle" dominant-baseline="central">v3</text></g>

<g class="c-teal"><rect x="116" y="58" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="141" y="70" text-anchor="middle" dominant-baseline="central">A1</text></g>
<g class="c-teal"><rect x="116" y="98" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="141" y="110" text-anchor="middle" dominant-baseline="central">A2</text></g>
<g class="c-coral"><rect x="174" y="58" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="199" y="70" text-anchor="middle" dominant-baseline="central">B1</text></g>
<g class="c-coral"><rect x="174" y="138" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="199" y="150" text-anchor="middle" dominant-baseline="central">B3</text></g>

<text class="ts" x="40"  y="196">v3 opbouwen = v1 + diff1 + diff2</text>
<text class="ts" x="40"  y="212">kost telkens berekening</text>

<line x1="340" y1="18" x2="340" y2="248" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="6 4"/>

<text class="th" x="510" y="26" text-anchor="middle">Git — snapshots</text>
<text class="ts" x="510" y="42" text-anchor="middle">volledige momentopname per commit</text>

<g class="c-gray"><rect x="358" y="58" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="388" y="70" text-anchor="middle" dominant-baseline="central">c1</text></g>
<g class="c-gray"><rect x="358" y="98" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="388" y="110" text-anchor="middle" dominant-baseline="central">c2</text></g>
<g class="c-gray"><rect x="358" y="138" width="60" height="24" rx="5" stroke-width="0.5"/><text class="ts" x="388" y="150" text-anchor="middle" dominant-baseline="central">c3</text></g>

<text class="ts" x="460" y="52" text-anchor="middle">bestand A</text>
<text class="ts" x="522" y="52" text-anchor="middle">bestand B</text>

<g class="c-teal"><rect x="434" y="58" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="459" y="70" text-anchor="middle" dominant-baseline="central">A1</text></g>
<g class="c-teal"><rect x="434" y="98" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="459" y="110" text-anchor="middle" dominant-baseline="central">A2</text></g>

<path d="M418 150 Q426 130 432 112" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="494" y="58" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="519" y="70" text-anchor="middle" dominant-baseline="central">B1</text></g>
<g class="c-coral"><rect x="494" y="98" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="519" y="110" text-anchor="middle" dominant-baseline="central">B1</text></g>
<g class="c-coral"><rect x="494" y="138" width="50" height="24" rx="4" stroke-width="0.5"/><text class="ts" x="519" y="150" text-anchor="middle" dominant-baseline="central">B3</text></g>

<text class="ts" x="358" y="192">ongewijzigd bestand → verwijzing,</text>
<text class="ts" x="358" y="208">geen kopie — spaart ruimte</text>

<text class="ts" x="340" y="248" text-anchor="middle">elke commit is direct leesbaar — geen reconstructie nodig</text>
</svg>
