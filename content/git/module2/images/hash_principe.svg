<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hash-principe: kleine wijziging, volledig andere hash</title>
<desc>Twee tekstinvoeren worden door SHA-1 verwerkt. Een kleine wijziging leidt tot een volledig andere hash-uitvoer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
:root { --t: #3d3d3a; --s: #73726c; --b: #d3d1c7; }
@media (prefers-color-scheme: dark) { :root { --t: #c2c0b6; --s: #888780; --b: #5f5e5a; } }
.th { font: 500 14px monospace; fill: var(--t); }
.ts { font: 400 12px sans-serif; fill: var(--s); }
.tl { font: 400 12px sans-serif; fill: var(--s); }
.c-gray rect  { fill: #f1efe8; stroke: #5f5e5a; }
.c-blue rect  { fill: #e6f1fb; stroke: #185fa5; }
.c-blue .th   { fill: #042c53; }
.c-teal rect  { fill: #e1f5ee; stroke: #0f6e56; }
.c-teal .th   { fill: #085041; }
.c-coral rect { fill: #faece7; stroke: #993c1d; }
.c-coral .th  { fill: #4a1b0c; }
@media (prefers-color-scheme: dark) {
  .c-gray rect  { fill: #2c2c2a; stroke: #b4b2a9; }
  .c-blue rect  { fill: #042c53; stroke: #85b7eb; }
  .c-blue .th   { fill: #b5d4f4; }
  .c-teal rect  { fill: #085041; stroke: #5dcaa5; }
  .c-teal .th   { fill: #9fe1cb; }
  .c-coral rect { fill: #4a1b0c; stroke: #f0997b; }
  .c-coral .th  { fill: #f5c4b3; }
}
line.arr { stroke: var(--b); stroke-width: 1.5; fill: none; }
</style>
</defs>

<text class="tl" x="40"  y="54">Invoer</text>
<text class="tl" x="260" y="54">Hashfunctie (SHA-1)</text>
<text class="tl" x="440" y="54">Hash-uitvoer</text>

<g class="c-gray">
  <rect x="40" y="62" width="160" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="120" y="80" text-anchor="middle" dominant-baseline="central">"Hello, Git!"</text>
</g>
<line x1="200" y1="80" x2="258" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue">
  <rect x="260" y="62" width="120" height="36" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="80" text-anchor="middle" dominant-baseline="central">SHA-1</text>
</g>
<line x1="380" y1="80" x2="438" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
  <rect x="440" y="62" width="200" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="540" y="80" text-anchor="middle" dominant-baseline="central">a8c9f4b2d3e1...</text>
</g>

<line x1="40" y1="120" x2="640" y2="120" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="142" text-anchor="middle">Één letter anders: "G" wordt "g"</text>

<g class="c-gray">
  <rect x="40" y="154" width="160" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="120" y="172" text-anchor="middle" dominant-baseline="central">"Hello, git!"</text>
</g>
<line x1="200" y1="172" x2="258" y2="172" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue">
  <rect x="260" y="154" width="120" height="36" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="172" text-anchor="middle" dominant-baseline="central">SHA-1</text>
</g>
<line x1="380" y1="172" x2="438" y2="172" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
  <rect x="440" y="154" width="200" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="540" y="172" text-anchor="middle" dominant-baseline="central">3f17c82a9b4d...</text>
</g>

<rect x="440" y="204" width="200" height="24" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="540" y="217" text-anchor="middle" dominant-baseline="central">Volledig andere hash</text>

<text class="ts" x="40" y="256">Elke hash is uniek voor de inhoud. Verandert er iets? Git detecteert het meteen.</text>
</svg>
